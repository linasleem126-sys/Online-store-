<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAILA - Shop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Georgia,serif}
body{background:#F5EFE6;color:#4A2A2A}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;position:sticky;top:0;background:#F5EFE6;z-index:10}
.logo{font-size:32px;letter-spacing:8px;color:#6B0F2A;font-weight:bold}
.top-btns{display:flex;gap:8px;align-items:center}
.about-btn{border:1px solid #6B0F2A;color:#6B0F2A;background:transparent;padding:8px 16px;border-radius:20px;cursor:pointer}
.cart-btn{background:#6B0F2A;color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:15px}
.hero{text-align:center;padding:20px 0 10px}
.hero h1{font-size:52px;letter-spacing:12px;color:#6B0F2A}
.hero p{color:#8A7A3A;font-size:19px;margin-top:6px}
.section-title{text-align:center;color:#6B0F2A;font-size:22px;margin:14px 0 6px;letter-spacing:2px}
.cat-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px}
.cat-card{background:#fff;border-radius:16px;overflow:hidden;text-align:center;padding-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cat-card img{width:100%;height:150px;object-fit:cover}
.cat-card h3{font-size:17px;margin:10px 6px;color:#4A2A2A;min-height:22px}
.shop-now{background:#6B0F2A;color:#fff;border:none;padding:9px 20px;border-radius:20px;cursor:pointer}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;flex-direction:row}
.cat-pill{white-space:nowrap;border:1px solid #6B0F2A;background:#fff;color:#6B0F2A;padding:8px 16px;border-radius:20px;cursor:pointer}
.cat-pill.active{background:#6B0F2A;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px}
.card{background:#EDE3D3;border-radius:16px;overflow:hidden;text-align:center;padding-bottom:12px}
.card img{width:100%;height:190px;object-fit:cover}
.card h3{font-size:18px;margin:10px 6px 6px;min-height:44px}
.price{color:#8A7A3A;font-weight:bold;margin-bottom:10px}
.add-btn{background:#6B0F2A;color:#fff;border:none;padding:10px 18px;border-radius:20px;cursor:pointer;width:85%}
#cartOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50}
#cartBox{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;padding:18px;z-index:60;display:none;text-align:right;direction:rtl}
.cart-item{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0;direction:rtl}
.cart-item img{width:60px;height:60px;object-fit:cover;border-radius:10px}
.cart-item b{flex:1;font-size:14px}
.qty{display:flex;align-items:center;gap:8px;direction:ltr}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid #6B0F2A;background:#fff;color:#6B0F2A;font-size:18px;cursor:pointer}
.qty span{font-weight:bold}
.del{color:red;background:none;border:none;font-size:18px;cursor:pointer}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-bottom:10px;font-size:14px;text-align:right;direction:rtl}
.confirm-btn{width:100%;background:#6B0F2A;color:#fff;border:none;padding:14px;border-radius:20px;font-size:16px;cursor:pointer}
.close-btn{width:100%;background:#eee;border:none;padding:12px;border-radius:20px;margin-top:8px;cursor:pointer}
.total{font-size:18px;font-weight:bold;text-align:center;margin:12px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 20px;border-radius:20px;z-index:100;display:none}
</style>
</head>
<body>
<header><div class="logo">LAILA</div><div class="top-btns"><button class="about-btn" onclick="alert('LAILA - Enjoy with our collection 💕')">About</button><button class="cart-btn" onclick="openCart()">Cart 🛒 (<span id="cartCount">0</span>)</button></div></header>
<div class="hero"><h1>LAILA</h1><p>Enjoy with our collection</p></div>

<div class="section-title">Shop by Category</div>
<div class="cat-cards" id="catCards">جاري تحميل الأقسام...</div>

<div class="cats" id="catsBar"><button class="cat-pill active" onclick="filterCatByIndex(-1,this)">الكل</button></div>
<div class="grid" id="grid">جاري التحميل...</div>

<div id="cartOverlay" onclick="closeCart()"></div>
<div id="cartBox">
<h2 style="color:#6B0F2A;text-align:center">🛒 الكارت بتاعك</h2>
<div id="cartItems"></div>
<div class="total" id="cartTotal"></div>
<div id="checkoutForm" style="display:none">
<h3 style="margin:12px 0">📍 بيانات التوصيل</h3>
<input id="custName" placeholder="الاسم بالكامل">
<input id="custPhone" placeholder="رقم التليفون">
<select id="custGov"><option value="">اختاري المحافظة</option><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>الدقهلية</option><option>الشرقية</option><option>الغربية</option><option>دمياط</option><option>بورسعيد</option><option>الإسماعيلية</option><option>السويس</option><option>المنوفية</option><option>القليوبية</option><option>البحيرة</option><option>كفر الشيخ</option><option>الفيوم</option><option>بني سويف</option><option>المنيا</option><option>أسيوط</option><option>سوهاج</option><option>قنا</option><option>الأقصر</option><option>أسوان</option><option>البحر الأحمر</option><option>مطروح</option><option>شمال سيناء</option><option>جنوب سيناء</option><option>الوادي الجديد</option></select>
<input id="custAddress" placeholder="العنوان بالتفصيل">
<label style="font-size:13px">صورة التحويل (اختياري):</label>
<input id="payShot" type="file" accept="image/*">
<label style="font-size:13px">الرقم اللي اتحول منه المبلغ:</label>
<input id="transferNumber" type="tel" inputmode="numeric" placeholder="مثال: 010xxxxxxxx">
<button class="confirm-btn" onclick="confirmOrder()">تأكيد الأوردر ✅</button>
</div>
<button class="close-btn" onclick="closeCart()">إغلاق</button>
</div>
<div class="toast" id="toast">Added to cart ✅</div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyCcSNVB5cnqtQluyWMyDX6I5q_dj7h6f2Y",authDomain:"laila-store-2dc4c.firebaseapp.com",projectId:"laila-store-2dc4c",storageBucket:"laila-store-2dc4c.firebasestorage.app",messagingSenderId:"450895782726",appId:"1:450895782726:web:57e264ff703863d6583b47",measurementId:"G-M9ZF3Y96DC"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let products=[]; let cats=[]; let activeCat='all';
let cart = JSON.parse(localStorage.getItem('laila_cart')||'[]');
let shotBase64="";
function saveCart(){ localStorage.setItem('laila_cart', JSON.stringify(cart)); updateCount(); }
function updateCount(){ let n=0; cart.forEach(i=>n+=i.qty); document.getElementById('cartCount').innerText=n; }
function showToast(t){ let el=document.getElementById('toast'); el.innerText=t; el.style.display='block'; setTimeout(()=>el.style.display='none',1500); }
async function load(){
  try{
    let pSnap = await db.collection("products").get({source:'server'});
    let cSnap = await db.collection("categories").get({source:'server'});
    products=[]; pSnap.forEach(d=>{let x=d.data();x.id=d.id;products.push(x);});
    cats=[]; cSnap.forEach(d=>{let x=d.data();x.id=d.id;cats.push(x);});
  }catch(e){
    let pSnap = await db.collection("products").get();
    let cSnap = await db.collection("categories").get();
    products=[]; pSnap.forEach(d=>{let x=d.data();x.id=d.id;products.push(x);});
    cats=[]; cSnap.forEach(d=>{let x=d.data();x.id=d.id;cats.push(x);});
  }
  renderCats(); renderCatCards(); renderProducts();
  db.collection("products").onSnapshot(s=>{ if(s.empty && products.length>0) return; products=[]; s.forEach(d=>{let x=d.data();x.id=d.id;products.push(x);}); renderProducts(); });
  db.collection("categories").onSnapshot(s=>{ if(s.empty && cats.length>0) return; cats=[]; s.forEach(d=>{let x=d.data();x.id=d.id;cats.push(x);}); renderCats(); renderCatCards(); });
}
function renderCats(){
  let bar=document.getElementById('catsBar');
  bar.innerHTML='<button class="cat-pill '+(activeCat==='all'?'active':'')+'" onclick="filterCatByIndex(-1,this)">الكل</button>' + cats.map((c,i)=>`<button class="cat-pill ${activeCat===c.name?'active':''}" onclick="filterCatByIndex(${i},this)">${c.name}</button>`).join('');
}
function renderCatCards(){
  let box=document.getElementById('catCards');
  if(!cats.length){ box.innerHTML='لسه مفيش أقسام'; return; }
  box.innerHTML=cats.map((c,i)=>`
    <div class="cat-card">
      ${c.image?`<img src="${c.image}">`:'<div style="height:150px;background:#EDE3D3;display:flex;align-items:center;justify-content:center;font-size:40px">✨</div>'}
      <h3>${c.name}</h3>
      <button class="shop-now" onclick="goToCat(${i})">Shop Now</button>
    </div>`).join('');
}
function goToCat(idx){
  filterCatByIndex(idx,null);
  document.getElementById('grid').scrollIntoView({behavior:'smooth'});
}
function filterCatByIndex(idx,btn){
  activeCat = idx===-1 ? 'all' : cats[idx].name;
  document.querySelectorAll('.cat-pill').forEach(b=>b.classList.remove('active')); if(btn) btn.classList.add('active');
  renderCats(); renderProducts();
}
function renderProducts(){
  let list = activeCat==='all' ? products : products.filter(p=>p.cat===activeCat);
  let grid=document.getElementById('grid');
  if(!list.length){ grid.innerHTML='لسه مفيش منتجات في القسم ده'; return; }
  grid.innerHTML=list.map(p=>`
    <div class="card">
      ${p.image?`<img src="${p.image}">`:'<div style="height:190px;background:#ddd"></div>'}
      <h3>${p.name}</h3>
      <div class="price">${p.price} EGP</div>
      <button class="add-btn" onclick="addToCart('${p.id}')">Add to Cart</button>
    </div>`).join('');
}
function addToCart(id){
  let p=products.find(x=>x.id===id); if(!p) return;
  let found=cart.find(x=>x.id===id);
  if(found) found.qty++;
  else cart.push({id:p.id,name:p.name,price:Number(p.price),image:p.image||'',qty:1});
  saveCart(); showToast('Added to cart ✅');
}
function openCart(){
  document.getElementById('cartOverlay').style.display='block';
  document.getElementById('cartBox').style.display='block';
  renderCart();
}
function closeCart(){ document.getElementById('cartOverlay').style.display='none'; document.getElementById('cartBox').style.display='none'; }
function renderCart(){
  let box=document.getElementById('cartItems');
  if(!cart.length){ box.innerHTML='الكارت فاضي'; document.getElementById('cartTotal').innerText=''; document.getElementById('checkoutForm').style.display='none'; return; }
  let total=0; cart.forEach(i=>total+=i.price*i.qty);
  box.innerHTML=cart.map((item,idx)=>`
    <div class="cart-item">
      ${item.image?`<img src="${item.image}">`:''}
      <b>${item.name}<br><small>${item.price} EGP</small></b>
      <div class="qty">
        <button onclick="changeQty(${idx},-1)">-</button>
        <span>${item.qty}</span>
        <button onclick="changeQty(${idx},1)">+</button>
      </div>
      <button class="del" onclick="removeItem(${idx})">×</button>
    </div>`).join('');
  document.getElementById('cartTotal').innerText='التوتال: '+total+' EGP';
  document.getElementById('checkoutForm').style.display='block';
}
function changeQty(idx,delta){
  cart[idx].qty+=delta;
  if(cart[idx].qty<=0) cart.splice(idx,1);
  saveCart(); renderCart();
}
function removeItem(idx){ cart.splice(idx,1); saveCart(); renderCart(); }
document.getElementById('payShot').addEventListener('change',function(e){
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader(); r.onload=function(ev){
    let img=new Image(); img.onload=function(){
      let c=document.createElement('canvas'); let max=800; let w=img.width,h=img.height;
      if(w>max){h=h*max/w;w=max;} if(h>max){w=w*max/h;h=max;}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      shotBase64=c.toDataURL('image/jpeg',0.6);
    }; img.src=ev.target.result;
  }; r.readAsDataURL(f);
});
async function confirmOrder(){
  if(!cart.length){ alert('الكارت فاضي'); return; }
  let name=document.getElementById('custName').value.trim();
  let phone=document.getElementById('custPhone').value.trim();
  let gov=document.getElementById('custGov').value;
  let address=document.getElementById('custAddress').value.trim();
  let transferNumber=document.getElementById('transferNumber').value.trim();
  if(!name||!phone||!gov||!address){ alert('كملي بيانات العنوان الأول'); return; }
  let total=0; let itemsText=''; cart.forEach(i=>{ total+=i.price*i.qty; itemsText+=i.name+' x'+i.qty+' - '; });
  try{
    await db.collection("orders").add({
      customer_name:name, name:name, phone:phone, gov:gov, address:address,
      transfer_number:transferNumber, transferNumber:transferNumber,
      product:itemsText, items:itemsText, total:total, total_price:total,
      shot:shotBase64||'', status:'pending', createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    cart=[]; saveCart(); renderCart(); closeCart(); shotBase64=''; document.getElementById('payShot').value=''; document.getElementById('transferNumber').value='';
    document.getElementById('custName').value=''; document.getElementById('custPhone').value=''; document.getElementById('custGov').value=''; document.getElementById('custAddress').value='';
    alert('تم استلام أوردرك ✅ هنكلمك للتأكيد');
  }catch(e){ alert('مش اتبعت - جربي تاني'); }
}
updateCount();
load();
</script>
</body>
</html>
