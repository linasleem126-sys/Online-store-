<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAILA - Shop</title>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#F5EFE6;color:#4A2A2A;padding:16px}
h1{color:#6B0F2A;text-align:center;letter-spacing:8px}
.cat{background:#fff;border:1px solid #E8DCC8;border-radius:14px;padding:14px;margin:14px 0}
.cat h2{margin:0 0 10px;color:#6B0F2A}
.prod{display:flex;gap:10px;background:#FFF9F0;border-radius:10px;padding:10px;margin:8px 0}
.prod img{width:70px;height:70px;object-fit:cover;border-radius:8px}
.prod b{display:block}
.price{color:#C9A24B;font-weight:bold}
button{background:#6B0F2A;color:#fff;border:none;padding:8px 14px;border-radius:20px;cursor:pointer}
#msg{text-align:center;color:#999;margin-top:30px}
</style>
</head>
<body>
<h1>LAILA</h1>
<div id="msg">Loading...</div>
<div id="shop"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCcSNVB5HCFa5Q9J0O2aQy2y5r5a5a5a5a5a5a5",
  authDomain: "laila-store-2dc4c.firebaseapp.com",
  projectId: "laila-store-2dc4c",
  storageBucket: "laila-store-2dc4c.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const shopEl = document.getElementById('shop');
const msgEl = document.getElementById('msg');
let cats = [];
let prods = [];
function render(){
  if(!cats.length && !prods.length){
    msgEl.textContent = "No categories yet - check dashboard";
    shopEl.innerHTML = "";
    return;
  }
  msgEl.textContent = "";
  let html = "";
  cats.forEach(c=>{
    html += `<div class="cat"><h2>${c.name || 'Category'}</h2>`;
    const items = prods.filter(p=>p.categoryId===c.id);
    if(!items.length) html += `<p style="color:#999">No products in this category yet</p>`;
    items.forEach(p=>{
      html += `<div class="prod">${p.image ? `<img src="${p.image}">` : ''}<div><b>${p.name||''}</b><div>${p.desc||''}</div><div class="price">${p.price||''} EGP</div><button>Add to Cart</button></div></div>`;
    });
    html += `</div>`;
  });
  shopEl.innerHTML = html;
}
db.collection("categories").onSnapshot(snap=>{
  cats = snap.docs.map(d=>({id:d.id, ...d.data()}));
  render();
});
db.collection("products").onSnapshot(snap=>{
  prods = snap.docs.map(d=>({id:d.id, ...d.data()}));
  render();
});
</script>
</body>
</html>
