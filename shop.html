<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAILA - Shop</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:#F5EFE6;color:#4A2A2A}
header{background:#F5EFE6;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #E8DCC8;position:sticky;top:0;z-index:10}
.logo{font-size:28px;letter-spacing:8px;color:#6B0F2A;font-weight:bold;cursor:pointer}
.top-btns{display:flex;gap:10px;align-items:center}
.top-btns button{background:none;border:1px solid #6B0F2A;color:#6B0F2A;padding:7px 14px;border-radius:20px;cursor:pointer}
#cartBtn{background:#6B0F2A!important;color:#fff!important;border:none!important;padding:8px 16px;border-radius:20px;cursor:pointer}
.hero{text-align:center;padding:28px 16px}
.hero h1{font-size:42px;letter-spacing:10px;color:#6B0F2A}
.hero p{color:#C9A24B;letter-spacing:3px;margin-top:8px}
#msg{text-align:center;color:#999;margin:20px}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 40px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:600px){.grid3{grid-template-columns:repeat(3,1fr);gap:8px}}
.card{background:#fff;border:1px solid #E8DCC8;border-radius:18px;overflow:hidden;text-align:center;padding-bottom:12px;cursor:pointer}
.card img{width:100%;height:150px;object-fit:cover}
.card h3{color:#6B0F2A;margin:10px 0 8px;font-size:16px}
.card button{background:#6B0F2A;color:#fff;border:none;padding:7px 16px;border-radius:20px;cursor:pointer}
.p-card{background:#fff;border:1px solid #E8DCC8;border-radius:14px;overflow:hidden;text-align:center;padding-bottom:10px}
.p-card img{width:100%;height:140px;object-fit:cover}
.p-card b{display:block;margin:8px 4px 4px;font-size:14px}
.price{color:#C9A24B;font-weight:bold;margin:4px 0 8px}
.p-card button{background:#6B0F2A;color:#fff;border:none;padding:7px 14px;border-radius:20px;cursor:pointer}
.back{background:none;border:1px solid #6B0F2A;color:#6B0F2A;padding:8px 16px;border-radius:20px;cursor:pointer;margin-bottom:14px}
#about{display:none;max-width:900px;margin:0 auto;padding:20px}
#cartDrawer{display:none;position:fixed;right:0;top:0;width:320px;max-width:90%;height:100%;background:#fff;padding:16px;box-shadow:-2px 0 10px rgba(0,0,0,.2);z-index:20}
</style>
</head>
<body>
<header>
<div class="logo" onclick="showShop()">LAILA</div>
<div class="top-btns">
<button onclick="showAbout()">About</button>
<button id="cartBtn" onclick="toggleCart()">Cart 🛒 (<span id="cartCount">0</span>)</button>
</div>
</header>

<div id="shopView">
<div class="hero"><h1>LAILA</h1><p>Enjoy with our collection</p></div>
<div id="msg">Loading...</div>
<div class="wrap">
<div id="catsView"></div>
<div id="prodsView" style="display:none"></div>
</div>
</div>

<div id="about">
<h2 style="color:#6B0F2A">About LAILA</h2>
<p style="margin-top:10px;line-height:1.8">LAILA is a luxury store. New collection, elegant pieces, made with love.</p>
<button onclick="showShop()" style="margin-top:16px;background:#6B0F2A;color:#fff;border:none;padding:10px 20px;border-radius:20px;cursor:pointer">Back to Shop</button>
</div>

<div id="cartDrawer">
<h3 style="color:#6B0F2A">Your Cart</h3>
<div id="cartItems" style="margin:12px 0">Cart is empty</div>
<button onclick="toggleCart()" style="background:none;border:1px solid #6B0F2A;color:#6B0F2A;padding:8px 14px;border-radius:20px;cursor:pointer">Close</button>
</div>

<script>
const firebaseConfig = {apiKey:"AIzaSyCcSNVB5cnqtQluyWMyDX6I5q_dj7h6f2Y",authDomain:"laila-store-2dc4c.firebaseapp.com",projectId:"laila-store-2dc4c",storageBucket:"laila-store-2dc4c.firebasestorage.app",messagingSenderId:"450895782726",appId:"1:450895782726:web:57e264ff703863d6583b47",measurementId:"G-M9ZF3Y96DC"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let cats=[], prods=[], cart=[], currentCat=null;
function showShop(){document.getElementById('shopView').style.display='block';document.getElementById('about').style.display='none';renderCats()}
function showAbout(){document.getElementById('shopView').style.display='none';document.getElementById('about').style.display='block'}
function toggleCart(){const d=document.getElementById('cartDrawer');d.style.display=d.style.display==='block'?'none':'block'}
function addToCart(id){const p=prods.find(x=>x.id===id);cart.push(p);document.getElementById('cartCount').textContent=cart.length;document.getElementById('cartItems').innerHTML=cart.map(c=>`<div style="padding:8px 0;border-bottom:1px solid #eee">${c.name} - ${c.price} EGP</div>`).join('');alert('Added to cart')}
function renderCats(){
  const msg=document.getElementById('msg');
  if(!cats.length){msg.textContent="No categories yet";return}
  msg.textContent="";
  currentCat=null;
  document.getElementById('catsView').innerHTML=`<div class="grid3">${cats.map(c=>`
    <div class="card" onclick="openCat('${c.name}')">
      ${c.image?`<img src="${c.image}">`:`<div style="height:150px;background:#FFF9F0;display:flex;align-items:center;justify-content:center;font-size:40px">📂</div>`}
      <h3>${c.name}</h3>
      <button onclick="event.stopPropagation();openCat('${c.name}')">Shop Now</button>
    </div>`).join('')}</div>`;
  document.getElementById('catsView').style.display='block';
  document.getElementById('prodsView').style.display='none';
}
function openCat(name){
  currentCat=name;
  const items=prods.filter(p=>p.cat===name);
  document.getElementById('catsView').style.display='none';
  const pv=document.getElementById('prodsView');
  pv.style.display='block';
  let html=`<button class="back" onclick="renderCats()">← Back to Categories</button><h2 style="color:#6B0F2A;margin-bottom:14px">${name}</h2>`;
  if(!items.length) html+=`<p style="color:#999">No products in this category yet</p>`;
  else html+=`<div class="grid3">${items.map(p=>`
    <div class="p-card">
      ${p.image?`<img src="${p.image}">`:`<div style="height:140px;background:#FFF9F0;display:flex;align-items:center;justify-content:center">✨</div>`}
      <b>${p.name||''}</b>
      <div class="price">${p.price||''} EGP</div>
      <button onclick="addToCart('${p.id}')">Add to Cart</button>
    </div>`).join('')}</div>`;
  pv.innerHTML=html;
}
db.collection("categories").onSnapshot(snap=>{cats=snap.docs.map(d=>({id:d.id,...d.data()}));if(!currentCat) renderCats()});
db.collection("products").onSnapshot(snap=>{prods=snap.docs.map(d=>({id:d.id,...d.data()}));if(currentCat) openCat(currentCat)});
</script>
</body>
</html>
